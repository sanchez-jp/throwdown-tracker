name: WodBuster HTML probe

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "index.html"
      - "sw.js"
      - "supabase/functions/wodbuster-results/**"
      - "supabase/functions/briefing-notifications/**"
      - "supabase/migrations/**"
      - "scripts/wodbuster-parser.mjs"
      - "tests/**"
      - ".github/workflows/wodbuster-probe.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run WodBuster parser regression tests
        run: node --test tests/wodbuster-parser.test.mjs
      - name: Check browser module syntax
        run: |
          node --input-type=module -e 'import fs from "node:fs"; const html=fs.readFileSync("index.html","utf8"); const tag=`<script type="module">`; const start=html.indexOf(tag); const end=html.indexOf("</script>",start); if(start<0||end<0) throw new Error("Module script not found"); new Function(html.slice(start+tag.length,end));'
      - name: Check Edge Function TypeScript
        uses: denoland/setup-deno@v2
      - run: deno check supabase/functions/wodbuster-results/index.ts
      - run: deno check supabase/functions/briefing-notifications/index.ts
      - name: Inspect WodBuster client-side data sources
        if: github.event_name == 'workflow_dispatch'
        run: node scripts/wodbuster-client-probe.mjs
      - name: Upload raw HTML and diagnostic report
        if: always() && github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: wodbuster-client-probe
          path: |
            wodbuster-client-probe.json
            wodbuster-html/
          if-no-files-found: ignore
          retention-days: 7
