name: WodBuster HTML probe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Inspect WodBuster client-side data sources
        run: node scripts/wodbuster-client-probe.mjs
      - name: Upload raw HTML and diagnostic report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wodbuster-client-probe
          path: |
            wodbuster-client-probe.json
            wodbuster-html/
          if-no-files-found: ignore
          retention-days: 7
